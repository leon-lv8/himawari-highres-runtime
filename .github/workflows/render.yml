name: Render Himawari
run-name: Render Himawari / ${{ inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: GitLab dispatch identifier
        required: false
        type: string

concurrency:
  group: himawari-production-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Authenticate to private GHCR package
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PULL_USERNAME }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}
      - name: Pull immutable renderer
        run: docker pull ghcr.io/leon-lv8/himawari-highres:3250be6f902b7fdf40820282da9c588c777f6b01
      - name: Render and publish
        env:
          REGION_MODE: full_disk
          MAX_ZOOM: '7'
          ARCHIVE_ZOOMS: 6,7
          SOURCE_INTERVAL_MINUTES: '60'
          SOURCE_LAG_MINUTES: ${{ vars.SOURCE_LAG_MINUTES || '15' }}
          TRUE_COLOR_COMPOSITE: true_color_reproduction
          STRIP_TILE_ROWS: ${{ vars.STRIP_TILE_ROWS || '16' }}
          STRIP_WORKERS: ${{ vars.STRIP_WORKERS || '2' }}
          WARP_THREADS: ${{ vars.WARP_THREADS || '2' }}
          WARP_MEMORY_MB: ${{ vars.WARP_MEMORY_MB || '256' }}
          WEBP_WORKERS: ${{ vars.WEBP_WORKERS || '4' }}
          DASK_CHUNK_SIZE: ${{ vars.DASK_CHUNK_SIZE || '16MiB' }}
          OSS_ENABLED: 'true'
          OPENLIST_S3_ENDPOINT: ${{ secrets.OPENLIST_S3_ENDPOINT }}
          OPENLIST_S3_ACCESS_KEY_ID: ${{ secrets.OPENLIST_S3_ACCESS_KEY_ID }}
          OPENLIST_S3_SECRET_ACCESS_KEY: ${{ secrets.OPENLIST_S3_SECRET_ACCESS_KEY }}
          OPENLIST_S3_BUCKET: ${{ secrets.OPENLIST_S3_BUCKET }}
          OPENLIST_S3_PREFIX: ${{ secrets.OPENLIST_S3_PREFIX || 'himawari' }}
          OSS_RETENTION_DAYS: '2'
          OSS_CLEANUP_INTERVAL_HOURS: '24'
        run: |
          docker run --rm \
            -e REGION_MODE -e MAX_ZOOM -e ARCHIVE_ZOOMS -e SOURCE_INTERVAL_MINUTES \
            -e SOURCE_LAG_MINUTES -e TRUE_COLOR_COMPOSITE \
            -e STRIP_TILE_ROWS -e STRIP_WORKERS -e WARP_THREADS -e WARP_MEMORY_MB \
            -e WEBP_WORKERS -e DASK_CHUNK_SIZE \
            -e OSS_ENABLED -e OPENLIST_S3_ENDPOINT -e OPENLIST_S3_ACCESS_KEY_ID \
            -e OPENLIST_S3_SECRET_ACCESS_KEY -e OPENLIST_S3_BUCKET \
            -e OPENLIST_S3_PREFIX -e OSS_RETENTION_DAYS \
            -e OSS_CLEANUP_INTERVAL_HOURS \
            ghcr.io/leon-lv8/himawari-highres:3250be6f902b7fdf40820282da9c588c777f6b01

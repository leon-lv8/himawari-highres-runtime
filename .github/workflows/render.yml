name: Render Himawari

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

concurrency:
  group: himawari-production-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.gate.outputs.render }}
    steps:
      - id: gate
        env:
          INTERVAL: ${{ vars.RENDER_INTERVAL_MINUTES || '30' }}
          OFFSET: ${{ vars.RENDER_SCHEDULE_OFFSET_MINUTES || '7' }}
        run: |
          case "$INTERVAL" in 10|20|30|60) ;; *) echo "invalid interval" >&2; exit 1;; esac
          minute=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M) - OFFSET))
          minute=$(((minute % 1440 + 1440) % 1440))
          slot=$((minute - minute % 10))
          if [ $((slot % INTERVAL)) -eq 0 ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
          fi

  render:
    needs: gate
    if: needs.gate.outputs.render == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Authenticate to private GHCR package
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PULL_USERNAME }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}
      - name: Pull immutable renderer
        run: docker pull ghcr.io/leon-lv8/himawari-highres:b5aec80142ab5665ef0eb4f969c5ba9eeb15f068
      - name: Render and publish
        env:
          REGION_MODE: full_disk
          MAX_ZOOM: '7'
          ARCHIVE_ZOOMS: 6,7
          SOURCE_LAG_MINUTES: ${{ vars.SOURCE_LAG_MINUTES || '60' }}
          OSS_ENABLED: 'true'
          OPENLIST_S3_ENDPOINT: ${{ secrets.OPENLIST_S3_ENDPOINT }}
          OPENLIST_S3_ACCESS_KEY_ID: ${{ secrets.OPENLIST_S3_ACCESS_KEY_ID }}
          OPENLIST_S3_SECRET_ACCESS_KEY: ${{ secrets.OPENLIST_S3_SECRET_ACCESS_KEY }}
          OPENLIST_S3_BUCKET: ${{ secrets.OPENLIST_S3_BUCKET }}
          OPENLIST_S3_PREFIX: ${{ secrets.OPENLIST_S3_PREFIX || 'himawari' }}
          OSS_RETENTION_DAYS: '2'
          OSS_CLEANUP_INTERVAL_HOURS: '24'
        run: |
          docker run --rm \
            -e REGION_MODE -e MAX_ZOOM -e ARCHIVE_ZOOMS -e SOURCE_LAG_MINUTES \
            -e OSS_ENABLED -e OPENLIST_S3_ENDPOINT -e OPENLIST_S3_ACCESS_KEY_ID \
            -e OPENLIST_S3_SECRET_ACCESS_KEY -e OPENLIST_S3_BUCKET \
            -e OPENLIST_S3_PREFIX -e OSS_RETENTION_DAYS \
            -e OSS_CLEANUP_INTERVAL_HOURS \
            ghcr.io/leon-lv8/himawari-highres:b5aec80142ab5665ef0eb4f969c5ba9eeb15f068
